<section id="panel-now" data-map-heading tabindex="-1" class="tab-panel map-home poster-home" aria-label="Race map">

    <div id="map-waiting" class="map-waiting" hidden></div>
    <div class="poster-map-label" aria-hidden="true">ONE STEP. THEN ANOTHER. <span>♡</span></div>

      <button type="button" class="poster-person-card" data-poster-person="huiyan"><img class="poster-person-cutout" src="assets/avatars-v5/huiyan.webp" alt=""><span class="poster-person-name"><strong>Huiyan</strong><span class="person-status-dot" id="poster-huiyan-dot" aria-hidden="true"></span></span><small id="poster-huiyan-status">Waiting for supporters</small></button>
      <button type="button" class="poster-person-card" data-poster-person="graham"><img class="poster-person-cutout" src="assets/avatars-v5/graham.webp" alt=""><span class="poster-person-name"><strong>Graham</strong><span class="person-status-dot" id="poster-graham-dot" aria-hidden="true"></span></span><small id="poster-graham-status">Waiting for supporters</small></button>

    <nav class="runner-dock poster-dock" aria-label="Quick map actions">
